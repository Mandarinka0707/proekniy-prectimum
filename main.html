<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeartMind - Главная</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-page">
    <section class="app-shell">
      <aside class="app-sidebar">
        <div class="brand app-brand">
          <h1 class="brand-title">HeartMind</h1>
          <p class="brand-subtitle">AI-ассистент для помощи в отношениях</p>
        </div>

        <button class="new-chat-btn" type="button">↺ Новый чат</button>

        <div class="history-block">
          <p>Вчера</p>
          <div class="history-item"></div>
          <p>25.04.26</p>
          <div class="history-item"></div>
        </div>
      </aside>

      <section class="app-content">
        <nav class="top-menu">
          <button type="button">Мой профиль</button>
          <button type="button">Чат</button>
          <button type="button">Мое настроение</button>
          <button type="button">Статистика</button>
        </nav>

        <div class="welcome-block">
          <div class="avatar-mark">⬡</div>
          <p>С возвращением, Имя!<br>Готовы разобраться в том, что вас волнует?</p>
        </div>

        <div class="center-brand">
          <h2>HeartMind</h2>
          <p>AI-ассистент для помощи в отношениях</p>
          <div class="role-selector">
            <button class="role-toggle" type="button" aria-expanded="false" aria-controls="roleMenu">
              Выберите роль AI <span>➤</span>
            </button>
            <div class="role-menu" id="roleMenu" hidden>
              <button type="button" data-role="МЕДИАТОР">МЕДИАТОР <span>➤</span><small>Нейтральный взгляд и поиск компромисса</small></button>
              <button type="button" data-role="КПТ-ДНЕВНИК">КПТ-ДНЕВНИК <span>➤</span><small>Работа с мыслями и убеждениями</small></button>
              <button type="button" data-role="ТРЕНЕР ННО">ТРЕНЕР ННО <span>➤</span><small>Я-сообщения и чувства без осуждения</small></button>
            </div>
          </div>
        </div>

        <form class="message-bar">
          <input type="text" placeholder="Сообщение">
          <button type="submit">➤</button>
        </form>
      </section>
    </section>
  </main>
  <script>
    const toggle = document.querySelector('.role-toggle');
    const menu = document.querySelector('.role-menu');
    const roleButtons = document.querySelectorAll('.role-menu button');
    const toggleLabel = toggle.childNodes[0];
    const ROLE_STORAGE_KEY = 'heartmind:selectedRole';

    const setRoleLabel = (roleName) => {
      toggleLabel.textContent = `${roleName} `;
    };

    toggle.addEventListener('click', () => {
      const opened = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!opened));
      menu.hidden = opened;
    });

    roleButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const roleName = button.dataset.role;
        setRoleLabel(roleName);
        localStorage.setItem(ROLE_STORAGE_KEY, roleName);
        toggle.setAttribute('aria-expanded', 'false');
        menu.hidden = true;
      });
    });

    const savedRole = localStorage.getItem(ROLE_STORAGE_KEY);
    if (savedRole) {
      setRoleLabel(savedRole);
    }

    document.addEventListener('click', (event) => {
      if (!event.target.closest('.role-selector')) {
        toggle.setAttribute('aria-expanded', 'false');
        menu.hidden = true;
      }
    });
  </script>
</body>
</html>
